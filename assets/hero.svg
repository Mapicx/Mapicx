<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Manas Pathak - terminal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171033"/><stop offset="0.55" stop-color="#1a1340"/><stop offset="1" stop-color="#12152f"/>
    </linearGradient>
    <radialGradient id="glowV" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8b7bff" stop-opacity="0.7"/><stop offset="1" stop-color="#8b7bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowP" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff8fd0" stop-opacity="0.6"/><stop offset="1" stop-color="#ff8fd0" stop-opacity="0"/></radialGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#221a44"/><stop offset="1" stop-color="#16112f"/></linearGradient>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2358"/><stop offset="1" stop-color="#1d1642"/></linearGradient>
    <linearGradient id="barfill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#67e8f9"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity="0"/><stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.08"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
    <filter id="bigblur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>

    <clipPath id="c1"><rect x="46" y="101" width="0" height="26"><animate attributeName="width" from="0" to="392" begin="0.2s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="46" y="139" width="0" height="26"><animate attributeName="width" from="0" to="446" begin="1.1s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="46" y="191" width="0" height="26"><animate attributeName="width" from="0" to="280" begin="2.0s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="46" y="229" width="0" height="26"><animate attributeName="width" from="0" to="520" begin="2.8s" dur="1.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="46" y="267" width="0" height="26"><animate attributeName="width" from="0" to="510" begin="3.9s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="c6"><rect x="46" y="305" width="0" height="26"><animate attributeName="width" from="0" to="408" begin="4.9s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="cbar"><rect x="50" y="372" width="0" height="16"><animate attributeName="width" from="0" to="520" begin="5.9s" dur="1.2s" fill="freeze"/></rect></clipPath>

    <style>
      .mono { font-family:'JetBrains Mono','Fira Code',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace; }
      .caret { animation: blink 1.15s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1000" height="470" rx="26" fill="url(#bg)"/>

  <!-- soft color washes behind the panel -->
  <g filter="url(#bigblur)">
    <ellipse cx="180" cy="120" rx="200" ry="150" fill="url(#glowV)"/>
    <ellipse cx="840" cy="360" rx="220" ry="160" fill="url(#glowP)"/>
  </g>

  <!-- glass window -->
  <rect x="40" y="34" width="920" height="402" rx="22" fill="url(#win)" stroke="#3a2f6e" stroke-width="1.5"/>
  <path d="M40 56 a22 22 0 0 1 22 -22 h876 a22 22 0 0 1 22 22 v22 h-920 z" fill="url(#titlebar)"/>
  <circle cx="70" cy="56" r="6.5" fill="#ff9db1"/>
  <circle cx="94" cy="56" r="6.5" fill="#ffdca8"/>
  <circle cx="118" cy="56" r="6.5" fill="#9ff0d0"/>
  <text x="500" y="61" text-anchor="middle" class="mono" font-size="14" fill="#8b83b8">manas@neo — ~/whoami</text>

  <g class="mono" font-size="21">
    <g clip-path="url(#c1)"><text x="60" y="120"><tspan fill="#5eead4">manas@neo:~$</tspan><tspan fill="#d9d5f0"> ./whoami --verbose</tspan></text></g>
    <g clip-path="url(#c2)"><text x="60" y="158"><tspan fill="#7d76a8">booting neural interface ...</tspan><tspan fill="#a78bfa"> [ OK ]</tspan></text></g>
    <g clip-path="url(#c3)"><text x="60" y="210"><tspan fill="#c4b5fd">class </tspan><tspan fill="#67e8f9">Manas</tspan><tspan fill="#d9d5f0">(</tspan><tspan fill="#f9a8d4">Engineer</tspan><tspan fill="#d9d5f0">):</tspan></text></g>
    <g clip-path="url(#c4)"><text x="60" y="248"><tspan fill="#d9d5f0">    focus = [</tspan><tspan fill="#a5f3d0">"ML/AI"</tspan><tspan fill="#d9d5f0">, </tspan><tspan fill="#a5f3d0">"LLM Agents"</tspan><tspan fill="#d9d5f0">, </tspan><tspan fill="#a5f3d0">"Deep Learning"</tspan><tspan fill="#d9d5f0">]</tspan></text></g>
    <g clip-path="url(#c5)"><text x="60" y="286"><tspan fill="#d9d5f0">    role  = </tspan><tspan fill="#a5f3d0">"Data Scientist @ Data Axle"</tspan></text></g>
    <g clip-path="url(#c6)"><text x="60" y="324"><tspan fill="#d9d5f0">    open  = </tspan><tspan fill="#fbbf9c">True</tspan><tspan fill="#7d76a8">    # let's build something</tspan></text></g>
  </g>

  <rect class="caret" width="11" height="23" rx="2" fill="#67e8f9" x="60" y="103">
    <animate attributeName="x"
      values="60;60;452;452;60;506;506;60;340;340;60;580;580;60;570;570;60;468;468"
      keyTimes="0;0.028;0.141;0.155;0.155;0.268;0.282;0.282;0.380;0.394;0.394;0.535;0.549;0.549;0.676;0.690;0.690;0.817;1"
      dur="7.1s" fill="freeze"/>
    <animate attributeName="y"
      values="103;103;103;103;141;141;141;193;193;193;231;231;231;269;269;269;307;307;307"
      keyTimes="0;0.028;0.141;0.155;0.155;0.268;0.282;0.282;0.380;0.394;0.394;0.535;0.549;0.549;0.676;0.690;0.690;0.817;1"
      dur="7.1s" fill="freeze"/>
  </rect>

  <g class="mono" font-size="13">
    <rect x="60" y="372" width="520" height="16" rx="8" fill="#241c48"/>
    <rect x="60" y="372" width="520" height="16" rx="8" fill="url(#barfill)" clip-path="url(#cbar)"/>
    <text x="594" y="384" fill="#a78bfa" opacity="0">100% &#8212; neural weights loaded<animate attributeName="opacity" from="0" to="1" begin="7.0s" dur="0.4s" fill="freeze"/></text>
    <text x="60" y="418" fill="#7d76a8"><tspan fill="#5eead4">manas@neo:~$</tspan> _</text>
  </g>

  <rect x="40" y="34" width="920" height="70" fill="url(#scan)" opacity="0.7">
    <animate attributeName="y" values="34;366;34" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
